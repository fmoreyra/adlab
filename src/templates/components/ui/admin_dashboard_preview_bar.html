{# Shown when an admin previews a non-admin role dashboard. #}
{% if user.is_admin_user %}
<div class="mb-6 rounded-lg border border-gray-300 bg-gray-100 px-4 py-3 text-sm text-gray-800">
    <div class="flex flex-wrap items-center justify-between gap-3">
        <span class="font-medium">Vista previa como administrador</span>
        <a href="{% url 'pages:dashboard_admin' %}"
           class="inline-flex items-center font-semibold text-gray-900 hover:text-black underline">
            ← Volver al panel de administración
        </a>
    </div>
</div>
{% endif %}
